<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
        <radialGradient id="auraRadial" cx="50%" cy="45%" r="65%">
            <stop offset="0%" stop-color="#162238" />
            <stop offset="60%" stop-color="#0F172A" />
            <stop offset="100%" stop-color="#080C14" />
        </radialGradient>
        <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15" />
        </linearGradient>
    </defs>
    <!-- Background rounded squircle / rect -->
    <rect width="512" height="512" rx="128" fill="url(#auraRadial)" />
    <!-- Ambient Orbital Aura Guide Rings -->
    <circle cx="256" cy="256" r="215" fill="none" stroke="url(#glowRing)" stroke-width="2.5" stroke-dasharray="10 10" />
    <circle cx="256" cy="256" r="175" fill="none" stroke="url(#glowRing)" stroke-width="3" />
</svg>

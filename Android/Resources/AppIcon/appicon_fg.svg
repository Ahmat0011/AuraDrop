<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <!-- Smart TV Outline -->
    <rect x="110" y="130" width="292" height="200" rx="20" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <!-- TV Stand -->
    <path d="M 210 330 L 190 380 L 322 380 L 302 330" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Cast Wi-Fi Waves emanating inside TV -->
    <!-- Dot -->
    <circle cx="170" cy="270" r="14" fill="#38BDF8" />
    <!-- Wave 1 -->
    <path d="M 170 230 A 40 40 0 0 1 210 270" fill="none" stroke="#38BDF8" stroke-width="16" stroke-linecap="round" />
    <!-- Wave 2 -->
    <path d="M 170 190 A 80 80 0 0 1 250 270" fill="none" stroke="#38BDF8" stroke-width="16" stroke-linecap="round" />
    <!-- Play symbol in upper right -->
